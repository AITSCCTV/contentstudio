services:
  - type: web
    name: aits-contentstudio
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:render
    startCommand: node dist-render/server/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: STUDIO_USER
        value: aits-team
      # Add secrets privately after deployment. App stays locked until configured.
      - key: POSTING_ENABLED
        value: false
      - key: MONITORING_ENABLED
        value: false
